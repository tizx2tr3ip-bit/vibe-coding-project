<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Note Nest</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><div class="eyebrow">Portfolio project</div><h1>Note Nest</h1><p class="muted">A searchable notes project with autosave and export.</p></div><span class="pill">Vanilla JavaScript</span></header><section class="grid" style="grid-template-columns:280px 1fr"><div class="card"><button id="newNote" style="width:100%">New note</button><input id="search" placeholder="Search notes" aria-label="Search notes" style="width:100%;margin:14px 0"><ul id="notes"></ul></div><div class="card"><label>Title<input id="title" maxlength="100" placeholder="Untitled"></label><label style="margin-top:14px">Content<textarea id="content" placeholder="Start writing..."></textarea></label><div class="row" style="margin-top:12px"><small id="status">Saved locally</small><button id="download" class="secondary">Export text</button><button id="delete" class="danger">Delete</button></div></div></section><p class="muted" style="margin-top:30px">Your data stays in this browser.</p></main><script src="app.js"></script></body></html>
