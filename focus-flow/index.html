<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Focus Flow</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><div class="eyebrow">Portfolio project</div><h1>Focus Flow</h1><p class="muted">A focused work timer with break cycles and session history.</p></div><span class="pill">Vanilla JavaScript</span></header><section class="grid"><div class="card" style="text-align:center"><span id="phase" class="pill">Focus</span><div id="clock" class="big" style="font-size:5rem;margin:25px 0">25:00</div><div class="row"><button id="start">Start</button><button id="reset" class="secondary">Reset</button><button id="skip" class="secondary">Skip</button></div></div><div class="card"><h2>Settings</h2><form id="settings"><label>Focus minutes<input id="focus" type="number" min="1" max="120" value="25"></label><label>Break minutes<input id="breakTime" type="number" min="1" max="60" value="5"></label><button>Save settings</button></form><p class="muted">Completed focus sessions: <strong id="count">0</strong></p></div></section><p class="muted" style="margin-top:30px">Your data stays in this browser.</p></main><script src="app.js"></script></body></html>
