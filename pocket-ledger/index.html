<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Pocket Ledger</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><div class="eyebrow">Portfolio project</div><h1>Pocket Ledger</h1><p class="muted">An expense tracker with categories, totals, and CSV export.</p></div><span class="pill">Vanilla JavaScript</span></header><section class="grid"><div class="card"><h2>Add transaction</h2><form id="form"><label>Description<input id="desc" required maxlength="60" placeholder="Coffee"></label><div class="row"><label>Amount<input id="amount" type="number" min="0.01" step="0.01" required placeholder="4.50"></label><label>Type<select id="type"><option>Expense</option><option>Income</option></select></label></div><label>Category<select id="category"><option>Food</option><option>Travel</option><option>Shopping</option><option>Home</option><option>Other</option></select></label><button>Add transaction</button></form></div><div class="card"><h2>Overview</h2><p class="muted">Current balance</p><div id="balance" class="big"></div><p id="summary" class="muted"></p><button id="export" class="secondary">Export CSV</button></div></section><section class="card" style="margin-top:16px"><header><h2>Transactions</h2><select id="filter" aria-label="Filter transactions"><option>All</option><option>Expense</option><option>Income</option></select></header><ul id="list"></ul></section><p class="muted" style="margin-top:30px">Your data stays in this browser.</p></main><script src="app.js"></script></body></html>
